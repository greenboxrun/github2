name: crawl

# 수동 실행 전용 (Actions 탭 → crawl → Run workflow)
on:
  workflow_dispatch:
    inputs:
      sites:
        description: "실행할 사이트 키 (공백 구분, 비우면 전체)"
        required: false
        default: ""

# 결과를 레포에 커밋하므로 쓰기 권한이 필요하다
permissions:
  contents: write

# 동시에 두 번 돌면 결과 커밋이 충돌하므로 하나씩 실행
concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      flaresolverr:
        image: ghcr.io/flaresolverr/flaresolverr:latest
        ports:
          - 8191:8191

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: 의존성 설치
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      # 세션 쿠키 캐시 복원: 가장 최근에 저장된 캐시를 가져온다
      - name: 세션 캐시 복원
        uses: actions/cache/restore@v4
        with:
          path: result/.cache/sessions
          key: sessions-${{ github.run_id }}
          restore-keys: sessions-

      - name: 수집
        env:
          SITES: ${{ inputs.sites }}
        run: python run.py $SITES

      # 캐시는 키를 덮어쓸 수 없으므로 실행마다 새 키로 저장한다 (실패해도 저장)
      - name: 세션 캐시 저장
        if: always()
        uses: actions/cache/save@v4
        with:
          path: result/.cache/sessions
          key: sessions-${{ github.run_id }}

      # 결과(result/temp, all.json, report.json)를 레포에 커밋 (실패해도 성공한 사이트 결과는 저장)
      - name: 결과 커밋
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add result/
          if git diff --cached --quiet; then
            echo "변경된 결과 없음"
            exit 0
          fi
          git commit -m "수집 결과 갱신 (run #${{ github.run_number }})"
          git pull --rebase
          git push

      # 디버그 HTML은 커밋하지 않고, 실패했을 때만 아티팩트로 남긴다
      - name: 디버그 HTML 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ github.run_number }}
          path: result/debug/
          if-no-files-found: ignore
          retention-days: 7
